[package]
name = "gitcrafted"
version = "0.3.4"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A small, personal visual git client"
publish = false
repository = "https://github.com/itowhid06/gitcrafted"
readme = "README.md"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
md5 = "0.7"
notify = "8"
notify-rust = "4"
open = "5"
portable-pty = "0.9"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# bat's syntax set: TypeScript, Vue, TOML, Dockerfile, PowerShell… beyond syntect's own.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
ureq = "2"
vt100 = "0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

# Linux packages, built by the release workflow (`cargo deb`, `cargo generate-rpm`).
[package.metadata.deb]
maintainer = "Towhidul I Chowdhury <itowhid06@users.noreply.github.com>"
section = "devel"
depends = "$auto, git"
extended-description = "A visual git client: commit graph with branch pills, diffs, blame, stashes, interactive rebase, conflicts and a built-in terminal. Drives the installed git command line."
assets = [
    ["target/release/gitcrafted", "usr/bin/", "755"],
    ["packaging/gitcrafted.desktop", "usr/share/applications/", "644"],
    ["assets/app-icon/hicolor/16x16/apps/gitcrafted.png", "usr/share/icons/hicolor/16x16/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/22x22/apps/gitcrafted.png", "usr/share/icons/hicolor/22x22/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/24x24/apps/gitcrafted.png", "usr/share/icons/hicolor/24x24/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/32x32/apps/gitcrafted.png", "usr/share/icons/hicolor/32x32/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/48x48/apps/gitcrafted.png", "usr/share/icons/hicolor/48x48/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/64x64/apps/gitcrafted.png", "usr/share/icons/hicolor/64x64/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/128x128/apps/gitcrafted.png", "usr/share/icons/hicolor/128x128/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/256x256/apps/gitcrafted.png", "usr/share/icons/hicolor/256x256/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/512x512/apps/gitcrafted.png", "usr/share/icons/hicolor/512x512/apps/gitcrafted.png", "644"],
    ["assets/app-icon/hicolor/scalable/apps/gitcrafted.svg", "usr/share/icons/hicolor/scalable/apps/gitcrafted.svg", "644"],
    ["README.md", "usr/share/doc/gitcrafted/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gitcrafted", dest = "/usr/bin/gitcrafted", mode = "755" },
    { source = "packaging/gitcrafted.desktop", dest = "/usr/share/applications/gitcrafted.desktop", mode = "644" },
    { source = "assets/app-icon/hicolor/16x16/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/16x16/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/22x22/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/22x22/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/24x24/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/24x24/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/32x32/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/32x32/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/48x48/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/48x48/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/64x64/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/64x64/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/128x128/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/128x128/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/256x256/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/256x256/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/512x512/apps/gitcrafted.png", dest = "/usr/share/icons/hicolor/512x512/apps/gitcrafted.png", mode = "644" },
    { source = "assets/app-icon/hicolor/scalable/apps/gitcrafted.svg", dest = "/usr/share/icons/hicolor/scalable/apps/gitcrafted.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/gitcrafted/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/gitcrafted/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/gitcrafted/LICENSE-APACHE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = "*"

[build-dependencies]
# Icon and version info for gitcrafted.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
